name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint notebooks (execution-breaking errors only)
        run: ruff check .
      - name: Lint and format-check scripts
        run: |
          ruff check --select E,F,W,I,B,UP scripts
          ruff format --check .

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check notebook cells parse and imports resolve
        env:
          USER_AGENT: rag-from-scratch-ci
        run: python scripts/check_notebooks.py --imports
